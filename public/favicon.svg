<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Midnight Gradient -->
    <linearGradient id="vsx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>

    <!-- Outer Rim Accent Gradient -->
    <linearGradient id="vsx-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#1F2A44"/>
      <stop offset="70%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glowing Cyan for Spoke "X" -->
    <linearGradient id="vsx-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Golden Dial Hub -->
    <linearGradient id="vsx-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="vsx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#vsx-bg)" stroke="url(#vsx-border)" stroke-width="3"/>

  <!-- 2. Outer Vault Body / Bezel -->
  <rect x="22" y="22" width="84" height="84" rx="16" fill="#090E1A" stroke="#1F2A44" stroke-width="3"/>
  <rect x="26" y="26" width="76" height="76" rx="12" fill="#121B2E" stroke="#1F2A44" stroke-width="1.5"/>

  <!-- 3. Heavy Vault Hinges on Left -->
  <rect x="16" y="36" width="9" height="16" rx="2.5" fill="#38BDF8" opacity="0.95"/>
  <rect x="16" y="76" width="9" height="16" rx="2.5" fill="#38BDF8" opacity="0.95"/>

  <!-- 4. Circular Dial Base -->
  <circle cx="64" cy="64" r="30" fill="#080D18" stroke="#1F2A44" stroke-width="3"/>
  <circle cx="64" cy="64" r="25" fill="#0D1424" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3.5 3"/>

  <!-- 5. Signature "X" Vault Wheel Spokes (VaultSplitX) -->
  <g filter="url(#vsx-glow)">
    <!-- Spoke Diagonal (\) -->
    <line x1="41" y1="41" x2="87" y2="87" stroke="url(#vsx-cyan)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="41" cy="41" r="5" fill="#BAE6FD"/>
    <circle cx="87" cy="87" r="5" fill="#BAE6FD"/>

    <!-- Spoke Diagonal (/) -->
    <line x1="87" y1="41" x2="41" y2="87" stroke="url(#vsx-cyan)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="87" cy="41" r="5" fill="#BAE6FD"/>
    <circle cx="41" cy="87" r="5" fill="#BAE6FD"/>
  </g>

  <!-- 6. Central Dial Wheel Hub -->
  <circle cx="64" cy="64" r="14" fill="#0D1424" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="8" fill="url(#vsx-gold)" stroke="#060A12" stroke-width="1"/>
  <circle cx="64" cy="64" r="3" fill="#060A12"/>
</svg>
