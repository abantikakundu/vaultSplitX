name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Compile, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci || npm install

      - name: Install Midnight Compact
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact update 0.31.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Compile VaultSplitX contract
        shell: bash
        run: |
          compact --version
          export COMPACT_BACKEND=wasm
          compact compile contracts/vaultSplitX.compact managed/vaultSplitX

      - name: Run privacy and distribution tests
        run: npm test

      - name: Build production frontend
        run: npm run build
